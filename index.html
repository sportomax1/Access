<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Access ERP</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#243247;background:#f3f5f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #dce2eb;border-radius:9px;padding:9px 13px;background:#fff;color:#28394e;transition:background .15s}button:hover{background:#eef2f7}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a4bde0;outline-offset:2px}.primary{background:#264d7e;color:white;border-color:#264d7e}.primary:hover{background:#193d69;color:#fff}header{height:66px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 25px;background:#172a42;color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px #172a4214}header strong{letter-spacing:1.6px;font-size:18px}header small{color:#c4d1df;font-size:12px}#account{display:flex;align-items:center;gap:12px;font-size:12px;min-width:0}#account span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#account button{background:#263c57;border-color:#496078;color:#fff;padding:7px 10px}main{display:flex;min-height:calc(100vh - 66px)}aside{width:220px;background:#fff;border-right:1px solid #e1e6ed;padding:20px 12px;flex-shrink:0;position:sticky;top:66px;height:calc(100vh - 66px);overflow:auto}aside:before{content:'WORKSPACE';display:block;color:#8a96a7;font-size:10px;font-weight:800;letter-spacing:1.4px;margin:4px 12px 13px}aside button{display:flex;align-items:center;width:100%;text-align:left;border:0;margin:3px 0;padding:11px 12px;border-radius:8px;font-size:13px;color:#556477}aside button.active{background:#e9eff7;color:#21466f;font-weight:750;box-shadow:inset 3px 0 #325e92}section{padding:27px clamp(16px,3vw,42px);flex:1;min-width:0;max-width:1700px;margin:0 auto}#heading{font-size:25px;letter-spacing:-.6px}#subtitle{margin:7px 0 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:13px;margin:20px 0}.card,.panel{background:#fff;border:1px solid #e1e6ed;border-radius:12px;padding:19px;box-shadow:0 2px 8px #21344b06}.card{min-height:126px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between}.card button{padding:6px 9px;font-size:12px}.metric{font-size:30px;font-weight:760;margin:9px 0;letter-spacing:-1px;color:#203e62}.muted{color:#748195;font-size:12px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:15px 0}.toolbar input{padding:10px 12px;border:1px solid #d6dee9;border-radius:8px;max-width:360px;width:100%;background:#fff}#org{max-width:min(100%,300px);padding:10px 12px;border:1px solid #dce2eb;border-radius:9px;background:#fff;font-size:13px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid #edf0f4;font-size:12px;white-space:nowrap}th{background:#f7f9fc;color:#657387;font-size:11px;text-transform:uppercase;letter-spacing:.5px}tr:hover td{background:#fafbfd}td button{padding:6px 9px;font-size:11px}.scroll{overflow:auto}.pill{border-radius:30px;padding:4px 10px;background:#edf3f8;color:#3b5c7d;font-size:11px;font-weight:650}#auth{max-width:460px;margin:8vh auto;padding:32px;background:#fff;border-radius:16px;border:1px solid #dce4ee;box-shadow:0 14px 40px #152e4a12}#auth h1{margin-bottom:7px}#auth input{display:block;width:100%;margin:13px 0;padding:12px;border:1px solid #cbd5e1;border-radius:8px}#auth .toolbar button{flex:1}#providers button{min-width:90px}.notice{background:#fff8e8;border:1px solid #eedfb5;border-radius:9px;padding:14px;margin:14px 0;font-size:13px;line-height:1.6}.error{color:#b32e3c}h1{font-size:26px;margin:0}h2{font-size:17px;letter-spacing:-.2px}a{color:#235da7}.panel h2{margin-top:0}.panel p{line-height:1.6}@media(max-width:850px){main{display:block}aside{display:flex;overflow-x:auto;position:static;width:100%;height:auto;padding:8px 12px;border-bottom:1px solid #e1e6ed;gap:4px}aside:before{display:none}aside button{white-space:nowrap;width:auto;flex-shrink:0;padding:9px 12px}aside button.active{box-shadow:inset 0 -3px #325e92}section{padding:18px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:0 15px}}@media(max-width:480px){header small{display:none}#account{max-width:58%}#heading{font-size:21px}.card,.panel{padding:14px}.metric{font-size:25px}#auth{margin:25px 12px;padding:20px}#org{width:100%}.cards{gap:9px}th,td{padding:10px 9px}}
.welcome,.module-summary{display:flex;align-items:center;justify-content:space-between;gap:20px;background:#fff;border:1px solid #e1e6ed;border-radius:12px;padding:22px;margin:18px 0}.welcome h2,.module-summary h2{font-size:22px;margin:5px 0}.welcome p,.module-summary p{color:#7b8798;font-size:13px;margin:0}.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.5px;color:#73849b}.dash-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:14px}.activity-row{display:flex;gap:12px;align-items:center;border-top:1px solid #edf0f4;padding:12px 0}.activity-row>div{flex:1;min-width:0}.activity-row strong{font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.activity-row small{display:block;font-size:11px;color:#8490a0;margin-top:4px;text-transform:capitalize}.activity-row time{font-size:11px;color:#8995a3}.activity-dot{height:9px;width:9px;border-radius:50%;background:#6686aa;flex-shrink:0}.health-row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #edf0f4;font-size:12px}.health-row strong{color:#254c76}.summary-count{text-align:center;min-width:70px}.summary-count strong{display:block;font-size:27px;color:#254c76}.summary-count small{color:#8490a0;font-size:11px}.module-tools{margin:18px 0}.module-tools input{flex:1;max-width:480px}.module-tools select{padding:10px;border:1px solid #dce2eb;border-radius:8px;background:#fff}.table-panel{padding:0}.record-id{display:block;font-size:10px;color:#9ba6b3;margin-top:4px}.empty{padding:25px;text-align:center;color:#8793a3}.danger-link{color:#ad4050}.editor{border:1px solid #dce3ed;border-radius:15px;box-shadow:0 20px 80px #10243a40;padding:25px;width:min(450px,calc(100vw - 30px))}.editor::backdrop{background:#14273c80}.editor label{display:block;margin:14px 0;font-size:12px;font-weight:650}.editor label input,.editor label select{display:block;width:100%;padding:11px;border:1px solid #d6deea;border-radius:8px;margin-top:6px}.editor-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}@media(max-width:750px){.dash-grid{grid-template-columns:1fr}.welcome,.module-summary{padding:15px}.module-tools input{max-width:none;flex-basis:100%}}[hidden]{display:none!important}body:has(#auth:not([hidden])){background:#eef2f7}body:has(#auth:not([hidden])) header,body:has(#auth:not([hidden])) main{display:none!important}#auth[hidden]{display:none!important}#auth{margin:clamp(36px,9vh,100px) auto;max-width:420px;padding:35px}.login-brand{font-size:20px;font-weight:850;letter-spacing:2px;color:#213d60;margin-bottom:30px}.login-brand span{font-size:10px;letter-spacing:1.3px;color:#8593a3;margin-left:6px}#auth h1{font-size:25px}.login-label{display:block;font-size:12px;font-weight:700;margin-top:17px;color:#43536a}#auth input{margin:7px 0 0}#auth .toolbar{margin:16px 0 0}#login{width:100%;padding:12px}#auth #providers{border-top:1px solid #e6eaf0;padding-top:18px;margin-top:19px}#auth .muted{line-height:1.6}#authmsg{min-height:16px}</style></head><body>
<header id="appHeader" hidden><div><strong>◈ ACCESS</strong> <small> / Enterprise ERP Lab</small></div><div id="account"></div></header>
<div id="auth"><div class="login-brand">◈ ACCESS <span>ERP LAB</span></div><h1>Welcome back</h1><p class="muted">Authentication and authorization testing environment</p><label class="login-label" for="email">Admin email / username</label><input id="email" type="email" autocomplete="username" placeholder="Email address"><label class="login-label" for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password"><div class="toolbar"><button class="primary" id="login">Sign in to workspace</button></div><div class="toolbar"><button id="reset">Reset password</button><button id="magic">Email magic link</button></div><div class="toolbar" id="providers"></div><p id="authmsg" class="muted"></p><p class="muted">Administrator access requires an authorized account. Use Reset password to set credentials for an existing email account.</p></div>
<main id="app" hidden><aside id="nav"></aside><section><div class="toolbar" style="justify-content:space-between"><div><h1 id="heading">Dashboard</h1><p id="subtitle" class="muted"></p></div><select id="org"></select></div><div id="content"></div></section></main>
<dialog id="editor" class="editor"><form id="recordForm"><div class="editor-head"><div class="eyebrow">RECORD DETAILS</div><h2 id="editorTitle">New record</h2></div><label>Title<input id="fieldTitle" maxlength="160" required placeholder="Record name"></label><label>Status<select id="fieldStatus"><option value="active">Active</option><option value="pending">Pending</option><option value="completed">Completed</option><option value="draft">Draft</option><option value="archived">Archived</option></select></label><label>Amount (USD)<input id="fieldAmount" type="number" step=".01" value="0"></label><p class="error" id="editorError"></p><div class="editor-actions"><button id="cancelEdit" type="button">Cancel</button><button class="primary" type="submit">Save record</button></div></form></dialog><script src="/config.js"></script><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const url='https://jadyqyrpgcmaixroizov.supabase.co';
const key=window.ACCESS_SUPABASE_PUBLISHABLE_KEY||'';
const supa=key?createClient(url,key,{db:{schema:'access'},auth:{flowType:'pkce',detectSessionInUrl:true}}):null;
const modules=['Dashboard','Customers','Inventory','Orders','Purchasing','Employees','Finance','Approvals','Users','Access Control','Audit Logs','Settings'];
const icons=['▦','♙','▣','▤','▥','♟','＄','✓','♧','⚿','≡','⚙'];
let session=null,orgs=[],orgId='',tab='Dashboard',records=[],permissions=[],search='',loadVersion=0,editing=null,role='viewer';
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(t){return '<div class="notice">'+esc(t)+'</div>'}
function status(t){$('authmsg').textContent=t}
async function auth(mode){if(!supa)return status('Supabase configuration missing.');const email=$('email').value.trim(),password=$('password').value;if(!email)return status('Enter your email address.');if(mode==='login'&&!password)return status('Enter your password. If you use Google, select Google instead.');const button=$('login');button.disabled=true;button.textContent='Signing in…';status('Checking credentials…');try{const r=mode==='login'?await supa.auth.signInWithPassword({email,password}):await supa.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+'/auth/callback'}});if(r.error){status('Sign-in failed: '+r.error.message);return}if(mode==='login'){status('Authenticated. Loading workspace…');await load()}else status('Check your email for a sign-in link.')}catch(e){status('Unable to sign in: '+(e?.message||String(e)))}finally{button.disabled=false;button.textContent='Sign in to workspace'}}
$('login').onclick=()=>auth('login');$('password').addEventListener('keydown',e=>{if(e.key==='Enter')auth('login')});$('email').addEventListener('keydown',e=>{if(e.key==='Enter')auth('login')});$('reset').onclick=async()=>{const email=$('email').value.trim();if(!email)return status('Enter your account email first.');if(!supa)return status('Supabase configuration missing.');try{const r=await supa.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/auth/callback'});status(r.error?.message||'If this email is registered, check your inbox for a password reset link.')}catch(e){status('Password reset failed: '+e.message)}};$('magic').onclick=()=>auth('magic');
for(const p of ['google']){let b=document.createElement('button');b.textContent=p==='azure'?'Microsoft':p[0].toUpperCase()+p.slice(1);b.onclick=async()=>{if(!supa)return status('Configure Supabase key first');let r=await supa.auth.signInWithOAuth({provider:p,options:{redirectTo:location.origin+'/auth/callback',scopes:p==='azure'?'email':''}});if(r.error)status(r.error.message)};$('providers').append(b)}
async function load(){if(!supa)return;const{data:{session:s}}=await supa.auth.getSession();session=s;$('auth').hidden=!!s;$('app').hidden=!s;$('appHeader').hidden=!s;$('account').innerHTML=s?'<span>'+esc(s.user.email)+'</span> <button id="logout">Sign out</button>':'';if(!s){orgs=[];orgId='';role='viewer';return}$('content').innerHTML=notice('Authenticated. Loading organization permissions…');$('logout').onclick=()=>supa.auth.signOut();let memberships;try{memberships=await supa.from('memberships').select('organization_id,role')}catch(e){$('content').innerHTML=notice('Could not load permissions: '+e.message);return}if(memberships.error){$('content').innerHTML=notice('Database access unavailable: '+memberships.error.message+'. Enable access schema in Supabase Data API and verify grants.');return}window.accessMemberships=memberships.data||[];let ids=window.accessMemberships.map(x=>x.organization_id);if(!ids.length){$('content').innerHTML=notice('Signed in, but no organization membership exists for this account. An administrator must assign your auth user ID to a demo organization.');$('org').innerHTML='';return}let result=await supa.from('organizations').select('id,name').in('id',ids);if(result.error){$('content').innerHTML=notice('Organization lookup failed: '+result.error.message);return}orgs=result.data||[];orgId=orgs.some(o=>o.id===orgId)?orgId:orgs[0]?.id;role=window.accessMemberships.find(m=>m.organization_id===orgId)?.role||'viewer';$('org').innerHTML=orgs.map(o=>'<option value="'+esc(o.id)+'">'+esc(o.name)+'</option>').join('');$('org').value=orgId;$('org').onchange=e=>{orgId=e.target.value;role=window.accessMemberships.find(m=>m.organization_id===orgId)?.role||'viewer';tab='Dashboard';render()};render()}
async function render(){if(!session||!orgId)return;const version=++loadVersion;const allowed=modules.filter(m=>['Dashboard','Settings'].includes(m)||(['Users','Access Control','Audit Logs'].includes(m)?['owner','admin'].includes(role):['owner','admin','manager','employee','viewer'].includes(role)));if(!allowed.includes(tab))tab='Dashboard';$('nav').innerHTML=allowed.map((m,i)=>'<button data-tab="'+m+'" class="'+(tab===m?'active':'')+'">'+icons[modules.indexOf(m)]+' &nbsp;'+m+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;search='';render()});$('heading').textContent=tab;$('subtitle').textContent='Organization-scoped ERP data and access testing';$('content').innerHTML='<p class="muted">Loading…</p>';let rr=await supa.from('records').select('*').eq('organization_id',orgId).order('created_at',{ascending:false}).limit(1000);if(version!==loadVersion)return;if(rr.error){$('content').innerHTML=notice(rr.error.message);return}records=rr.data||[];let content=$('content');
if(tab==='Dashboard'){let groups=Object.fromEntries(modules.slice(1,8).map(m=>[m,records.filter(r=>r.module===m.toLowerCase())]));content.innerHTML='<div class="welcome"><div><div class="eyebrow">WORKSPACE OVERVIEW</div><h2>Operational snapshot</h2><p>Current activity across your organization</p></div><span class="pill">Demo environment</span></div><div class="cards">'+Object.entries(groups).map(([m,r])=>'<div class="card"><div class="muted">'+m+'</div><div class="metric">'+r.length+'</div><button data-open="'+m+'">Explore '+m.toLowerCase()+' →</button></div>').join('')+'</div><div class="dash-grid"><div class="panel"><h2>Recent activity</h2><div class="activity">'+records.slice(0,8).map(r=>'<div class="activity-row"><span class="activity-dot"></span><div><strong>'+esc(r.title)+'</strong><small>'+esc(r.module)+' · '+esc(r.status)+'</small></div><time>'+esc(new Date(r.created_at).toLocaleDateString())+'</time></div>').join('')+'</div></div><div class="panel"><h2>Workspace health</h2><div class="health-row"><span>Organization records</span><strong>'+records.length+'</strong></div><div class="health-row"><span>Modules with data</span><strong>'+Object.values(groups).filter(x=>x.length).length+'</strong></div><div class="health-row"><span>Data isolation</span><strong>RLS</strong></div><p class="muted">Synthetic testing environment. Data access is enforced by Supabase policies.</p></div></div>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{tab=b.dataset.open;render()});return}
if(tab==='Users'){const u=await supa.rpc('list_org_users',{p_org:orgId});if(version!==loadVersion)return;content.innerHTML=u.error?notice('Cannot load user directory: '+u.error.message):'<div class="panel"><h2>Organization user accounts</h2><p class="muted">Visible only to owners and administrators. These are accounts assigned to the selected organization, not unrelated users of your shared Supabase project.</p><div class="scroll"><table><thead><tr><th>Email</th><th>Role</th><th>Last sign-in</th><th>User ID</th></tr></thead><tbody>'+(u.data||[]).map(x=>'<tr><td><strong>'+esc(x.email)+'</strong></td><td><span class="pill">'+esc(x.role)+'</span></td><td>'+esc(x.last_sign_in_at?new Date(x.last_sign_in_at).toLocaleString():'Never')+'</td><td class="muted">'+esc(x.user_id)+'</td></tr>').join('')+'</tbody></table></div><p class="muted">'+(u.data||[]).length+' user(s) assigned to this organization.</p></div>';return}
if(tab==='Access Control'){let p=await supa.from('role_permissions').select('*');permissions=p.data||[];content.innerHTML='<div class="panel"><h2>Role permission matrix</h2><p class="muted">Permissions are read-only here until an audited administrative editor is implemented.</p><div class="scroll"><table><thead><tr><th>Role</th><th>Module</th><th>Read</th><th>Create</th><th>Update</th><th>Delete</th></tr></thead><tbody>'+['owner','admin','manager','employee','viewer'].flatMap(role=>['customers','inventory','orders','purchasing','employees','finance','approvals'].map(mod=>'<tr><td>'+role+'</td><td>'+mod+'</td>'+['read','create','update','delete'].map(action=>'<td>'+(permissions.find(x=>x.role===role&&x.module===mod&&x.action===action)?.allowed?'✓':'—')+'</td>').join('')+'</tr>')).join('')+'</tbody></table></div></div>';return}
if(tab==='Audit Logs'){let a=await supa.from('audit_logs').select('*').eq('organization_id',orgId).order('occurred_at',{ascending:false}).limit(100);content.innerHTML=a.error?notice(a.error.message):'<div class="panel"><h2>Audit events</h2><div class="scroll"><table><tr><th>Time</th><th>Action</th><th>Entity</th></tr>'+(a.data||[]).map(x=>'<tr><td>'+esc(x.occurred_at)+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.entity)+'</td></tr>').join('')+'</table></div></div>';return}
if(tab==='Settings'){content.innerHTML='<div class="panel"><h2>Current session</h2><p>User: '+esc(session.user.email)+'</p><p>Auth UID: <code>'+esc(session.user.id)+'</code></p><p>Supabase project: myapi</p><p>Database schema: access</p><p class="muted">OAuth providers require separate configuration in the Supabase dashboard.</p></div>';return}
let mod=tab.toLowerCase();let rows=records.filter(r=>r.module===mod&&r.title.toLowerCase().includes(search.toLowerCase()));content.innerHTML='<div class="module-summary"><div><div class="eyebrow">OPERATIONS / '+esc(tab.toUpperCase())+'</div><h2>'+esc(tab)+' workspace</h2><p>Manage '+esc(tab.toLowerCase())+' records and track current status.</p></div><div class="summary-count"><strong>'+rows.length+'</strong><small>Records</small></div></div><div class="toolbar module-tools"><input id="search" type="search" aria-label="Search records" placeholder="Search '+esc(tab)+'…" value="'+esc(search)+'"><select id="statusfilter" aria-label="Filter by status"><option value="">All statuses</option>'+[...new Set(records.filter(r=>r.module===mod).map(r=>r.status))].map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select><button id="add" class="primary">+ Add '+esc(tab.slice(0,-1)||'record')+'</button></div><div class="panel scroll table-panel"><table><thead><tr><th>Record</th><th>Status</th><th>Amount</th><th>Created</th><th>Actions</th></tr></thead><tbody>'+rows.map(r=>'<tr data-title="'+esc(r.title.toLowerCase())+'" data-status="'+esc(r.status)+'"><td><strong>'+esc(r.title)+'</strong><small class="record-id">'+esc(r.id.slice(0,8))+'</small></td><td><span class="pill">'+esc(r.status)+'</span></td><td>'+Number(r.amount).toLocaleString(undefined,{style:'currency',currency:'USD'})+'</td><td>'+esc(new Date(r.created_at).toLocaleDateString())+'</td><td><button data-edit="'+r.id+'">Edit</button> <button data-del="'+r.id+'" class="danger-link">Delete</button></td></tr>').join('')+'</tbody></table><div id="empty" class="empty" hidden>No records match your filters.</div></div>';
const filter=()=>{let visible=0;document.querySelectorAll('tbody tr[data-title]').forEach(tr=>{tr.hidden=!(tr.dataset.title.includes(search.toLowerCase())&&(!$('statusfilter').value||tr.dataset.status===$('statusfilter').value));if(!tr.hidden)visible++});$('empty').hidden=visible>0};
$('search').oninput=e=>{search=e.target.value;filter()};$('statusfilter').onchange=filter;
const editForm=(old)=>{editing=old||null;$('editorTitle').textContent=old?'Edit record':'New '+tab.toLowerCase()+' record';$('fieldTitle').value=old?.title||'';$('fieldStatus').value=old?.status||'active';$('fieldAmount').value=old?.amount??0;$('editor').showModal();$('fieldTitle').focus()};
$('add').onclick=()=>editForm(null);
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editForm(records.find(r=>r.id===b.dataset.edit)));
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this record?'))return;let r=await supa.from('records').delete().eq('id',b.dataset.del).eq('organization_id',orgId);if(r.error)alert(r.error.message);else render()});
}
$('cancelEdit').onclick=()=>$('editor').close();
$('recordForm').onsubmit=async e=>{e.preventDefault();if(!session||!orgId)return;const payload={title:$('fieldTitle').value.trim(),status:$('fieldStatus').value.trim()||'active',amount:Number($('fieldAmount').value)||0};if(!payload.title)return;const r=editing?await supa.from('records').update(payload).eq('id',editing.id).eq('organization_id',orgId):await supa.from('records').insert({...payload,module:tab.toLowerCase(),organization_id:orgId});if(r.error){$('editorError').textContent=r.error.message;return}$('editorError').textContent='';$('editor').close();render()};

// Preserve the OAuth PKCE ?code= parameter until Supabase exchanges it for a session. Do not rewrite the callback URL before auth initialization.const resetParams=new URLSearchParams(location.search);if(resetParams.get('type')==='recovery'){status('Use your password recovery link to set a new password.')}
if(supa){supa.auth.onAuthStateChange(()=>setTimeout(()=>load().catch(e=>{$('content').innerHTML=notice('Workspace error: '+e.message);status(e.message)}),0));load().catch(e=>status('Initialization error: '+e.message))}else status('Deployment requires a Supabase publishable key configured in config.js.');
</script></body></html>
