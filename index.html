<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Access ERP</title><style>
:root{font-family:Inter,system-ui,Arial;background:#f5f7fa;color:#172438}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #d8dfe8;border-radius:8px;padding:9px 13px;background:white;color:#24344b}button:hover{background:#edf3fb}.primary{background:#2456a6;color:white;border:0}.primary:hover{background:#174482;color:white}header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:#13263e;color:white}header small{color:#a9bfd7}main{display:flex;min-height:calc(100vh - 67px)}aside{width:235px;background:white;border-right:1px solid #e2e7ef;padding:18px 12px;flex-shrink:0}aside button{display:block;width:100%;text-align:left;border:0;margin:3px 0}aside button.active{background:#e7effa;color:#194e96;font-weight:700}section{padding:26px;flex:1;min-width:0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:20px 0}.card,.panel{background:white;border:1px solid #e1e7ef;border-radius:12px;padding:20px}.metric{font-size:29px;font-weight:750;margin:8px 0}.muted{color:#65758b;font-size:13px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}.toolbar input{padding:10px;border:1px solid #ccd5e2;border-radius:8px;max-width:330px;width:100%}table{width:100%;border-collapse:collapse;background:white}th,td{padding:12px;text-align:left;border-bottom:1px solid #e7edf4;font-size:14px}th{background:#f7f9fc;color:#4a5c72} .scroll{overflow:auto}.pill{border-radius:20px;padding:4px 9px;background:#eaf2fb;font-size:12px}#auth{max-width:440px;margin:9vh auto;padding:28px;background:white;border-radius:14px;border:1px solid #dce4ee}#auth input{display:block;width:100%;margin:12px 0;padding:12px;border:1px solid #cbd5e1;border-radius:8px}.notice{background:#fff8e5;border:1px solid #f2dca2;border-radius:8px;padding:12px;margin:12px 0}.error{color:#ae2b37}h1{font-size:26px;margin:0}h2{font-size:18px}a{color:#235da7}@media(max-width:720px){main{display:block}aside{display:flex;overflow:auto;width:100%;padding:8px}aside button{white-space:nowrap;width:auto}section{padding:15px}header{padding:12px}.cards{grid-template-columns:repeat(2,1fr)}} </style></head><body>
<header><div><strong>◈ ACCESS</strong> <small> / Enterprise ERP Lab</small></div><div id="account"></div></header>
<div id="auth"><h1>Sign in to Access</h1><p class="muted">Authentication and authorization testing environment</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><div class="toolbar"><button class="primary" id="login">Sign in</button><button id="signup">Sign up</button><button id="magic">Email magic link</button></div><div class="toolbar" id="providers"></div><p id="authmsg" class="muted"></p><p class="muted">Email signup may require confirmation. Access to demo organizations requires an administrator to assign membership.</p></div>
<main id="app" hidden><aside id="nav"></aside><section><div class="toolbar" style="justify-content:space-between"><div><h1 id="heading">Dashboard</h1><p id="subtitle" class="muted"></p></div><select id="org"></select></div><div id="content"></div></section></main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const url='https://jadyqyrpgcmaixroizov.supabase.co';
const key=window.ACCESS_SUPABASE_PUBLISHABLE_KEY||'';
const supa=key?createClient(url,key,{db:{schema:'access'}}):null;
const modules=['Dashboard','Customers','Inventory','Orders','Purchasing','Employees','Finance','Approvals','Access Control','Audit Logs','Settings'];
const icons=['▦','♙','▣','▤','▥','♟','＄','✓','⚿','≡','⚙'];
let session=null,orgs=[],orgId='',tab='Dashboard',records=[],permissions=[],search='';
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(t){return '<div class="notice">'+esc(t)+'</div>'}
function status(t){$('authmsg').textContent=t}
async function auth(mode){if(!supa)return status('Supabase publishable key has not been configured.');let email=$('email').value,password=$('password').value;let r=mode==='login'?await supa.auth.signInWithPassword({email,password}):mode==='signup'?await supa.auth.signUp({email,password}):await supa.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin}});status(r.error?.message|| (mode==='login'?'Signed in':'Check your email for confirmation.'))}
$('login').onclick=()=>auth('login');$('signup').onclick=()=>auth('signup');$('magic').onclick=()=>auth('magic');
for(const p of ['google','github','azure','apple']){let b=document.createElement('button');b.textContent=p==='azure'?'Microsoft':p[0].toUpperCase()+p.slice(1);b.onclick=async()=>{if(!supa)return status('Configure Supabase key first');let r=await supa.auth.signInWithOAuth({provider:p,options:{redirectTo:location.origin,scopes:p==='azure'?'email':''}});if(r.error)status(r.error.message)};$('providers').append(b)}
async function load(){if(!supa)return;const{data:{session:s}}=await supa.auth.getSession();session=s;$('auth').hidden=!!s;$('app').hidden=!s;$('account').innerHTML=s?'<span>'+esc(s.user.email)+'</span> <button id="logout">Sign out</button>':'';if(!s)return;$('logout').onclick=()=>supa.auth.signOut();let memberships=await supa.from('memberships').select('organization_id,role');if(memberships.error){$('content').innerHTML=notice('Database access unavailable: '+memberships.error.message+'. Enable access schema in Supabase Data API and verify grants.');return}let ids=(memberships.data||[]).map(x=>x.organization_id);if(!ids.length){$('content').innerHTML=notice('Signed in, but no organization membership exists for this account. An administrator must assign your auth user ID to a demo organization.');$('org').innerHTML='';return}let result=await supa.from('organizations').select('id,name').in('id',ids);orgs=result.data||[];orgId=orgs.some(o=>o.id===orgId)?orgId:orgs[0]?.id;$('org').innerHTML=orgs.map(o=>'<option value="'+esc(o.id)+'">'+esc(o.name)+'</option>').join('');$('org').value=orgId;$('org').onchange=e=>{orgId=e.target.value;render()};render()}
async function render(){if(!session||!orgId)return;$('nav').innerHTML=modules.map((m,i)=>'<button data-tab="'+m+'" class="'+(tab===m?'active':'')+'">'+icons[i]+' &nbsp;'+m+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;search='';render()});$('heading').textContent=tab;$('subtitle').textContent='Organization-scoped ERP data and access testing';$('content').innerHTML='<p class="muted">Loading…</p>';let rr=await supa.from('records').select('*').eq('organization_id',orgId).order('created_at',{ascending:false}).limit(1000);if(rr.error){$('content').innerHTML=notice(rr.error.message);return}records=rr.data||[];let content=$('content');
if(tab==='Dashboard'){let groups=Object.fromEntries(modules.slice(1,8).map(m=>[m,records.filter(r=>r.module===m.toLowerCase())]));content.innerHTML='<div class="cards">'+Object.entries(groups).map(([m,r])=>'<div class="card"><div class="muted">'+m+'</div><div class="metric">'+r.length+'</div><button data-open="'+m+'">View records</button></div>').join('')+'</div><div class="panel"><h2>Security overview</h2><p>Data is scoped to the selected organization and enforced through database RLS.</p><p class="muted">This lab is for synthetic data only. Do not use it for real sensitive ERP information until security testing is complete.</p></div>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{tab=b.dataset.open;render()});return}
if(tab==='Access Control'){let p=await supa.from('role_permissions').select('*');permissions=p.data||[];content.innerHTML='<div class="panel"><h2>Role permission matrix</h2><p class="muted">Permissions are read-only here until an audited administrative editor is implemented.</p><div class="scroll"><table><thead><tr><th>Role</th><th>Module</th><th>Read</th><th>Create</th><th>Update</th><th>Delete</th></tr></thead><tbody>'+['owner','admin','manager','employee','viewer'].flatMap(role=>['customers','inventory','orders','purchasing','employees','finance','approvals'].map(mod=>'<tr><td>'+role+'</td><td>'+mod+'</td>'+['read','create','update','delete'].map(action=>'<td>'+(permissions.find(x=>x.role===role&&x.module===mod&&x.action===action)?.allowed?'✓':'—')+'</td>').join('')+'</tr>')).join('')+'</tbody></table></div></div>';return}
if(tab==='Audit Logs'){let a=await supa.from('audit_logs').select('*').eq('organization_id',orgId).order('occurred_at',{ascending:false}).limit(100);content.innerHTML=a.error?notice(a.error.message):'<div class="panel"><h2>Audit events</h2><div class="scroll"><table><tr><th>Time</th><th>Action</th><th>Entity</th></tr>'+(a.data||[]).map(x=>'<tr><td>'+esc(x.occurred_at)+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.entity)+'</td></tr>').join('')+'</table></div></div>';return}
if(tab==='Settings'){content.innerHTML='<div class="panel"><h2>Current session</h2><p>User: '+esc(session.user.email)+'</p><p>Auth UID: <code>'+esc(session.user.id)+'</code></p><p>Supabase project: myapi</p><p>Database schema: access</p><p class="muted">OAuth providers require separate configuration in the Supabase dashboard.</p></div>';return}
let mod=tab.toLowerCase();let rows=records.filter(r=>r.module===mod&&r.title.toLowerCase().includes(search.toLowerCase()));content.innerHTML='<div class="toolbar"><input id="search" placeholder="Search '+esc(tab)+'…" value="'+esc(search)+'"><button id="add" class="primary">+ New record</button></div><div class="panel scroll"><table><thead><tr><th>Title</th><th>Status</th><th>Amount</th><th>Created</th><th>Actions</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.title)+'</td><td><span class="pill">'+esc(r.status)+'</span></td><td>'+Number(r.amount).toLocaleString(undefined,{style:'currency',currency:'USD'})+'</td><td>'+esc(new Date(r.created_at).toLocaleDateString())+'</td><td><button data-edit="'+r.id+'">Edit</button> <button data-del="'+r.id+'">Delete</button></td></tr>').join('')+'</tbody></table></div>'; $('search').oninput=e=>{search=e.target.value;render()};$('add').onclick=async()=>{let title=prompt('Record title');if(!title)return;let r=await supa.from('records').insert({organization_id:orgId,module:mod,title});if(r.error)alert(r.error.message);else render()};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{let old=records.find(r=>r.id===b.dataset.edit);let title=prompt('Edit title',old.title);if(title===null||!title)return;let r=await supa.from('records').update({title}).eq('id',old.id).eq('organization_id',orgId);if(r.error)alert(r.error.message);else render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this record?'))return;let r=await supa.from('records').delete().eq('id',b.dataset.del).eq('organization_id',orgId);if(r.error)alert(r.error.message);else render()})}
if(supa){supa.auth.onAuthStateChange(()=>setTimeout(load,0));load()}else status('Deployment requires a Supabase publishable key configured in config.js.');
</script><script src="/config.js"></script></body></html>
