<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Access ERP</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#243247;background:#f3f5f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #dce2eb;border-radius:9px;padding:9px 13px;background:#fff;color:#28394e;transition:background .15s}button:hover{background:#eef2f7}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a4bde0;outline-offset:2px}.primary{background:#264d7e;color:white;border-color:#264d7e}.primary:hover{background:#193d69;color:#fff}header{height:66px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 25px;background:#172a42;color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px #172a4214}header strong{letter-spacing:1.6px;font-size:18px}header small{color:#c4d1df;font-size:12px}#account{display:flex;align-items:center;gap:12px;font-size:12px;min-width:0}#account span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#account button{background:#263c57;border-color:#496078;color:#fff;padding:7px 10px}main{display:flex;min-height:calc(100vh - 66px)}aside{width:220px;background:#fff;border-right:1px solid #e1e6ed;padding:20px 12px;flex-shrink:0;position:sticky;top:66px;height:calc(100vh - 66px);overflow:auto}aside:before{content:'WORKSPACE';display:block;color:#8a96a7;font-size:10px;font-weight:800;letter-spacing:1.4px;margin:4px 12px 13px}aside button{display:flex;align-items:center;width:100%;text-align:left;border:0;margin:3px 0;padding:11px 12px;border-radius:8px;font-size:13px;color:#556477}aside button.active{background:#e9eff7;color:#21466f;font-weight:750;box-shadow:inset 3px 0 #325e92}section{padding:27px clamp(16px,3vw,42px);flex:1;min-width:0;max-width:1700px;margin:0 auto}#heading{font-size:25px;letter-spacing:-.6px}#subtitle{margin:7px 0 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:13px;margin:20px 0}.card,.panel{background:#fff;border:1px solid #e1e6ed;border-radius:12px;padding:19px;box-shadow:0 2px 8px #21344b06}.card{min-height:126px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between}.card button{padding:6px 9px;font-size:12px}.metric{font-size:30px;font-weight:760;margin:9px 0;letter-spacing:-1px;color:#203e62}.muted{color:#748195;font-size:12px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:15px 0}.toolbar input{padding:10px 12px;border:1px solid #d6dee9;border-radius:8px;max-width:360px;width:100%;background:#fff}#org{max-width:min(100%,300px);padding:10px 12px;border:1px solid #dce2eb;border-radius:9px;background:#fff;font-size:13px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid #edf0f4;font-size:12px;white-space:nowrap}th{background:#f7f9fc;color:#657387;font-size:11px;text-transform:uppercase;letter-spacing:.5px}tr:hover td{background:#fafbfd}td button{padding:6px 9px;font-size:11px}.scroll{overflow:auto}.pill{border-radius:30px;padding:4px 10px;background:#edf3f8;color:#3b5c7d;font-size:11px;font-weight:650}#auth{max-width:460px;margin:8vh auto;padding:32px;background:#fff;border-radius:16px;border:1px solid #dce4ee;box-shadow:0 14px 40px #152e4a12}#auth h1{margin-bottom:7px}#auth input{display:block;width:100%;margin:13px 0;padding:12px;border:1px solid #cbd5e1;border-radius:8px}#auth .toolbar button{flex:1}#providers button{min-width:90px}.notice{background:#fff8e8;border:1px solid #eedfb5;border-radius:9px;padding:14px;margin:14px 0;font-size:13px;line-height:1.6}.error{color:#b32e3c}h1{font-size:26px;margin:0}h2{font-size:17px;letter-spacing:-.2px}a{color:#235da7}.panel h2{margin-top:0}.panel p{line-height:1.6}@media(max-width:850px){main{display:block}aside{display:flex;overflow-x:auto;position:static;width:100%;height:auto;padding:8px 12px;border-bottom:1px solid #e1e6ed;gap:4px}aside:before{display:none}aside button{white-space:nowrap;width:auto;flex-shrink:0;padding:9px 12px}aside button.active{box-shadow:inset 0 -3px #325e92}section{padding:18px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:0 15px}}@media(max-width:480px){header small{display:none}#account{max-width:58%}#heading{font-size:21px}.card,.panel{padding:14px}.metric{font-size:25px}#auth{margin:25px 12px;padding:20px}#org{width:100%}.cards{gap:9px}th,td{padding:10px 9px}}
</style></head><body>
<header><div><strong>◈ ACCESS</strong> <small> / Enterprise ERP Lab</small></div><div id="account"></div></header>
<div id="auth"><h1>Sign in to Access</h1><p class="muted">Authentication and authorization testing environment</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><div class="toolbar"><button class="primary" id="login">Sign in</button><button id="signup">Sign up</button><button id="magic">Email magic link</button></div><div class="toolbar" id="providers"></div><p id="authmsg" class="muted"></p><p class="muted">Email signup may require confirmation. Access to demo organizations requires an administrator to assign membership.</p></div>
<main id="app" hidden><aside id="nav"></aside><section><div class="toolbar" style="justify-content:space-between"><div><h1 id="heading">Dashboard</h1><p id="subtitle" class="muted"></p></div><select id="org"></select></div><div id="content"></div></section></main>
<script src="/config.js"></script><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const url='https://jadyqyrpgcmaixroizov.supabase.co';
const key=window.ACCESS_SUPABASE_PUBLISHABLE_KEY||'';
const supa=key?createClient(url,key,{db:{schema:'access'},auth:{flowType:'pkce',detectSessionInUrl:true}}):null;
const modules=['Dashboard','Customers','Inventory','Orders','Purchasing','Employees','Finance','Approvals','Access Control','Audit Logs','Settings'];
const icons=['▦','♙','▣','▤','▥','♟','＄','✓','⚿','≡','⚙'];
let session=null,orgs=[],orgId='',tab='Dashboard',records=[],permissions=[],search='',loadVersion=0;
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(t){return '<div class="notice">'+esc(t)+'</div>'}
function status(t){$('authmsg').textContent=t}
async function auth(mode){if(!supa)return status('Supabase publishable key has not been configured.');let email=$('email').value,password=$('password').value;let r=mode==='login'?await supa.auth.signInWithPassword({email,password}):mode==='signup'?await supa.auth.signUp({email,password}):await supa.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+'/auth/callback'}});status(r.error?.message|| (mode==='login'?'Signed in':'Check your email for confirmation.'))}
$('login').onclick=()=>auth('login');$('signup').onclick=()=>auth('signup');$('magic').onclick=()=>auth('magic');
for(const p of ['google','github','azure','apple']){let b=document.createElement('button');b.textContent=p==='azure'?'Microsoft':p[0].toUpperCase()+p.slice(1);b.onclick=async()=>{if(!supa)return status('Configure Supabase key first');let r=await supa.auth.signInWithOAuth({provider:p,options:{redirectTo:location.origin+'/auth/callback',scopes:p==='azure'?'email':''}});if(r.error)status(r.error.message)};$('providers').append(b)}
async function load(){if(!supa)return;const{data:{session:s}}=await supa.auth.getSession();session=s;$('auth').hidden=!!s;$('app').hidden=!s;$('account').innerHTML=s?'<span>'+esc(s.user.email)+'</span> <button id="logout">Sign out</button>':'';if(!s)return;$('logout').onclick=()=>supa.auth.signOut();let memberships=await supa.from('memberships').select('organization_id,role');if(memberships.error){$('content').innerHTML=notice('Database access unavailable: '+memberships.error.message+'. Enable access schema in Supabase Data API and verify grants.');return}let ids=(memberships.data||[]).map(x=>x.organization_id);if(!ids.length){$('content').innerHTML=notice('Signed in, but no organization membership exists for this account. An administrator must assign your auth user ID to a demo organization.');$('org').innerHTML='';return}let result=await supa.from('organizations').select('id,name').in('id',ids);orgs=result.data||[];orgId=orgs.some(o=>o.id===orgId)?orgId:orgs[0]?.id;$('org').innerHTML=orgs.map(o=>'<option value="'+esc(o.id)+'">'+esc(o.name)+'</option>').join('');$('org').value=orgId;$('org').onchange=e=>{orgId=e.target.value;render()};render()}
async function render(){if(!session||!orgId)return;const version=++loadVersion;$('nav').innerHTML=modules.map((m,i)=>'<button data-tab="'+m+'" class="'+(tab===m?'active':'')+'">'+icons[i]+' &nbsp;'+m+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;search='';render()});$('heading').textContent=tab;$('subtitle').textContent='Organization-scoped ERP data and access testing';$('content').innerHTML='<p class="muted">Loading…</p>';let rr=await supa.from('records').select('*').eq('organization_id',orgId).order('created_at',{ascending:false}).limit(1000);if(version!==loadVersion)return;if(rr.error){$('content').innerHTML=notice(rr.error.message);return}records=rr.data||[];let content=$('content');
if(tab==='Dashboard'){let groups=Object.fromEntries(modules.slice(1,8).map(m=>[m,records.filter(r=>r.module===m.toLowerCase())]));content.innerHTML='<div class="cards">'+Object.entries(groups).map(([m,r])=>'<div class="card"><div class="muted">'+m+'</div><div class="metric">'+r.length+'</div><button data-open="'+m+'">View records</button></div>').join('')+'</div><div class="panel"><h2>Security overview</h2><p>Data is scoped to the selected organization and enforced through database RLS.</p><p class="muted">This lab is for synthetic data only. Do not use it for real sensitive ERP information until security testing is complete.</p></div>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{tab=b.dataset.open;render()});return}
if(tab==='Access Control'){let p=await supa.from('role_permissions').select('*');permissions=p.data||[];content.innerHTML='<div class="panel"><h2>Role permission matrix</h2><p class="muted">Permissions are read-only here until an audited administrative editor is implemented.</p><div class="scroll"><table><thead><tr><th>Role</th><th>Module</th><th>Read</th><th>Create</th><th>Update</th><th>Delete</th></tr></thead><tbody>'+['owner','admin','manager','employee','viewer'].flatMap(role=>['customers','inventory','orders','purchasing','employees','finance','approvals'].map(mod=>'<tr><td>'+role+'</td><td>'+mod+'</td>'+['read','create','update','delete'].map(action=>'<td>'+(permissions.find(x=>x.role===role&&x.module===mod&&x.action===action)?.allowed?'✓':'—')+'</td>').join('')+'</tr>')).join('')+'</tbody></table></div></div>';return}
if(tab==='Audit Logs'){let a=await supa.from('audit_logs').select('*').eq('organization_id',orgId).order('occurred_at',{ascending:false}).limit(100);content.innerHTML=a.error?notice(a.error.message):'<div class="panel"><h2>Audit events</h2><div class="scroll"><table><tr><th>Time</th><th>Action</th><th>Entity</th></tr>'+(a.data||[]).map(x=>'<tr><td>'+esc(x.occurred_at)+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.entity)+'</td></tr>').join('')+'</table></div></div>';return}
if(tab==='Settings'){content.innerHTML='<div class="panel"><h2>Current session</h2><p>User: '+esc(session.user.email)+'</p><p>Auth UID: <code>'+esc(session.user.id)+'</code></p><p>Supabase project: myapi</p><p>Database schema: access</p><p class="muted">OAuth providers require separate configuration in the Supabase dashboard.</p></div>';return}
let mod=tab.toLowerCase();let rows=records.filter(r=>r.module===mod&&r.title.toLowerCase().includes(search.toLowerCase()));content.innerHTML='<div class="toolbar"><input id="search" placeholder="Search '+esc(tab)+'…" value="'+esc(search)+'"><button id="add" class="primary">+ New record</button></div><div class="panel scroll"><table><thead><tr><th>Title</th><th>Status</th><th>Amount</th><th>Created</th><th>Actions</th></tr></thead><tbody>'+rows.map(r=>'<tr data-title="'+esc(r.title.toLowerCase())+'"><td>'+esc(r.title)+'</td><td><span class="pill">'+esc(r.status)+'</span></td><td>'+Number(r.amount).toLocaleString(undefined,{style:'currency',currency:'USD'})+'</td><td>'+esc(new Date(r.created_at).toLocaleDateString())+'</td><td><button data-edit="'+r.id+'">Edit</button> <button data-del="'+r.id+'">Delete</button></td></tr>').join('')+'</tbody></table></div>'; $('search').oninput=e=>{search=e.target.value;document.querySelectorAll('tbody tr[data-title]').forEach(tr=>tr.hidden=!tr.dataset.title.includes(search.toLowerCase()))};$('add').onclick=async()=>{let title=prompt('Record title');if(!title)return;let r=await supa.from('records').insert({organization_id:orgId,module:mod,title});if(r.error)alert(r.error.message);else render()};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{let old=records.find(r=>r.id===b.dataset.edit);let title=prompt('Edit title',old.title);if(title===null||!title)return;let r=await supa.from('records').update({title}).eq('id',old.id).eq('organization_id',orgId);if(r.error)alert(r.error.message);else render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this record?'))return;let r=await supa.from('records').delete().eq('id',b.dataset.del).eq('organization_id',orgId);if(r.error)alert(r.error.message);else render()})}
if(location.pathname==='/auth/callback'){history.replaceState({},'', '/');}
if(supa){supa.auth.onAuthStateChange(()=>setTimeout(load,0));load()}else status('Deployment requires a Supabase publishable key configured in config.js.');
</script></body></html>
